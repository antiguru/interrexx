name: "Licenses"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # No tracked file may name the ooRexx licence (scripts/check-licence-text.sh).
  licence-text:
    name: no ooRexx licence text
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-licence-text.sh

  # No file under rust/ may cite an ooRexx source file
  # (scripts/check-oorexx-citations.sh).
  oorexx-citations:
    name: no ooRexx source citations
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-oorexx-citations.sh

  # Every dependency's licence must be one rust/deny.toml allows.
  dependencies:
    name: dependency licences
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses
      # The `jit` feature's dependencies (Cranelift) are outside the default graph.
      - run: cargo deny --features interrexx/jit check licenses
