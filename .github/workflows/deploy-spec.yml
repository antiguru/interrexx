name: "Deploy spec"
# Builds the language specification (spec/, an mdBook) and publishes it to the
# gh-pages branch under `spec/`, one directory per version: `spec/main/` for
# every push to main, `spec/<tag>/` for every `v*` tag. Each deploy replaces
# only its own directory (keep_files), so earlier versions stay. `spec/` also
# holds `versions.json`, which the book's version picker reads, and an
# `index.html` that redirects to the newest tag, or to `main/` while there is
# none. Other documents get their own top-level directory beside `spec/`.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-spec
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  deploy:
    name: Build and publish the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the preprocessor
        working-directory: rust
        run: |
          cargo build --locked --release -p rexx-spec --bin mdbook-rexx-spec
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Name the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=main" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the book
        run: mdbook build spec -d "$RUNNER_TEMP/site/spec/${{ steps.version.outputs.name }}"
      - name: Update the version list and the root redirect
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          site="$RUNNER_TEMP/site"
          spec="$site/spec"
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git show FETCH_HEAD:spec/versions.json > "$RUNNER_TEMP/old.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/old.json"
          else
            echo '[]' > "$RUNNER_TEMP/old.json"
          fi
          # main first, then tags newest first by version order.
          all=$({ jq -r '.[]' "$RUNNER_TEMP/old.json"; echo "$VERSION"; } | sort -u)
          { printf '%s\n' "$all" | grep -x main || true
            printf '%s\n' "$all" | grep -vx main | sort -rV || true
          } | jq -R . | jq -s . > "$spec/versions.json"
          latest=$(jq -r '[.[] | select(. != "main")][0] // "main"' "$spec/versions.json")
          cat > "$spec/index.html" <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>The interrexx Language Specification</title>
          <meta http-equiv="refresh" content="0; url=${latest}/">
          <link rel="canonical" href="${latest}/">
          <p><a href="${latest}/">The interrexx Language Specification</a></p>
          EOF
          # The site root lists the documents; the spec is the only one so far.
          cat > "$site/index.html" <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>interrexx documentation</title>
          <meta http-equiv="refresh" content="0; url=spec/">
          <p><a href="spec/">The interrexx Language Specification</a></p>
          EOF
          touch "$site/.nojekyll"
          cat "$spec/versions.json"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/site
          keep_files: true
