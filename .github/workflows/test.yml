name: "Test Suite"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install oracle build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake subversion libxml2-dev libncurses-dev strace
      - name: Build third-party trees
        run: ../scripts/setup-third-party.sh
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cargo test
        run: cargo test --locked --workspace --no-fail-fast -j4

  fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
