name: "Test Suite"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

env:
  # One archive name and one cache key shape shared by every job below.
  ARCHIVE: nextest-archive.tar.zst

jobs:
  # The unmodified third-party trees the tests compare against. Built once per script or
  # submodule revision and restored from the cache by every job that runs tests.
  third-party:
    name: third-party trees
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: key
        working-directory: .
        run: echo "key=third-party-${{ runner.os }}-$(git rev-parse HEAD:third_party/ooRexx)-${{ hashFiles('scripts/setup-third-party.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ steps.key.outputs.key }}
      - name: Install oracle build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake subversion libxml2-dev libncurses-dev
      - name: Build third-party trees
        if: steps.cache.outputs.cache-hit != 'true'
        run: ../scripts/setup-third-party.sh

  # Compiles every test binary once and packs them for the shards.
  build:
    name: build test archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: rust
          # A cache saved by a job that had the submodule could hold a build script's output for
          # an input that is gone here, so this job keeps its own.
          cache-key: no-submodule
      - name: Assert the upstream tier is absent
        # This job sees no submodule, no oracle build and no `build` link: a build script or a
        # test that reads one fails here instead of passing on a tree only some jobs have.
        working-directory: .
        run: |
          # The gitlink checks out as an empty directory without the submodule.
          rmdir third_party/ooRexx
          rmdir third_party
          test ! -e third_party
          test ! -e build && test ! -L build
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Archive the test binaries
        # Debug info is off, as setup-rust-toolchain sets it, and pinned here so the archive
        # does not grow if that default changes. The test binaries each link the whole
        # interpreter, so they are alike over long distances: the long-distance window is what
        # lets the compressor see that (220 MiB to 91 MiB at level 10, where level 16 saved 14 MiB more for 40 s of compression on a runner).
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: >
          cargo nextest archive --locked --workspace --archive-file "$ARCHIVE"
          --zstd-long --zstd-level 10
      - name: Check the standalone filter names
        # Every test the `standalone` profile filters out must still exist in the archive, so a
        # renamed test cannot silently leave the upstream set. A step here, not a test, because
        # a test would build the workspace from within itself.
        run: |
          mkdir "$RUNNER_TEMP/list"
          cargo nextest list --archive-file "$ARCHIVE" --extract-to "$RUNNER_TEMP/list" \
            --workspace-remap . --message-format json > "$RUNNER_TEMP/test-list.json"
          python3 scripts/check_standalone_filter.py .config/nextest.toml < "$RUNNER_TEMP/test-list.json"
      - name: Compile the headers in include/ as C and as C++
        # Each header on its own, with the warnings an embedder's build commonly turns on.
        # `-Wextern-c-compat` flags a C++ handle type declared inside an `extern "C"` block,
        # which the header generator must keep outside it.
        working-directory: .
        run: |
          for lang in c c++; do
            for header in rexx.h oorexxapi.h; do
              echo "#include \"$header\"" | clang -x "$lang" -fsyntax-only -Iinclude -Iinclude/platform/unix \
                -Wall -Wextra -Werror -Wextern-c-compat -
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: rust/${{ env.ARCHIVE }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Each shard runs every sixth test of the workspace's list, dealt round-robin. Tests that are
  # shards of one big test have consecutive names, so this spreads them over the shards, which a
  # hash of the name left to chance (all four sweep shards landed on one runner).
  shard:
    name: nextest shard ${{ matrix.shard }}/6
    needs: [third-party, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ needs.third-party.outputs.key }}
          fail-on-cache-miss: true
      - name: Remove everything of the upstream tier
        # Only ootest and oodocs are kept from the cache: the regular tier reads them, and
        # nothing of the oracle build or the submodule may be there for a test to find.
        working-directory: .
        run: |
          rm -rf third_party/oracle build
          # The gitlink checks out as an empty directory without the submodule.
          rmdir third_party/ooRexx
          rmdir third_party
          test ! -e third_party
          test ! -e build && test ! -L build
          test -d ootest
          test -d oodocs
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: rust
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Install svn
        # The extractor tests ask the oodocs working copy for its revision.
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Cargo nextest
        run: >
          cargo nextest run --archive-file "$ARCHIVE" --extract-to . --extract-overwrite --workspace-remap .
          --partition slice:${{ matrix.shard }}/6 --profile standalone

  # The specification's examples on the oracle, from the same archive.
  spec-oracle:
    name: spec examples against the oracle
    needs: [third-party, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ needs.third-party.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: rust
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Spec examples against the oracle
        env:
          REXX_SPEC_ORACLE: "1"
        run: >
          cargo nextest run --archive-file "$ARCHIVE" --extract-to . --extract-overwrite --workspace-remap .
          -E 'package(interrexx) & binary(spec)' --profile ci

  # The attached-thread tests that are too long for every shard: the stress runs that stand in
  # for simulation seeds, since the simulation refuses an attached thread's callback.
  attached-stress:
    name: attached-thread stress runs
    needs: [third-party, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ needs.third-party.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: rust
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Ignored attached-thread tests
        run: >
          cargo nextest run --archive-file "$ARCHIVE" --extract-to . --extract-overwrite --workspace-remap .
          -E 'package(interrexx) & (binary(attached_threads) | binary(instance_identity))' --run-ignored ignored-only --profile ci

  # BSF4ooRexx's test suite on a release build, through its JNI library compiled against
  # include/. The groups in ci/bsf-expected-failures.txt fail (#731); any other group that does
  # not pass fails the job, and so does a listed group that passes.
  bsf4oorexx:
    name: BSF4ooRexx test suite
    needs: [third-party]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # No symbols: the release profile's debug info changes no code and only slows the build.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      BSF_SOURCES: ${{ github.workspace }}/bsf4oorexx/sources
      BSF_WORK: ${{ github.workspace }}/bsf4oorexx/work
      # Seconds one group may run: low enough that every group running into it, each with its kill
      # grace, still ends with the setup and the build inside timeout-minutes.
      BSF_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: rust
          # No other job builds the release profile, so this one keeps its own cache. It holds the
          # compiled dependencies only, not the workspace crates, and only main saves it: pull
          # requests restore main's and add none.
          cache-key: bsf4oorexx-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache/restore@v6
        with:
          # The paths the third-party job saves, which the entry is looked up by too. Only ootest
          # is used: the next step removes the rest.
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ needs.third-party.outputs.key }}
          fail-on-cache-miss: true
      - name: Remove everything of the upstream tier
        # The JNI library compiles against include/ only, so no ooRexx header may be there to find.
        working-directory: .
        run: |
          rm -rf third_party/oracle build oodocs
          # The gitlink checks out as an empty directory without the submodule.
          rmdir third_party/ooRexx
          rmdir third_party
          test ! -e third_party
          test ! -e build && test ! -L build
          test ! -e oodocs
          test -d ootest
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: source
        name: Pinned BSF4ooRexx sources
        # The pinned branch and revision, which the source cache is keyed by.
        working-directory: .
        run: |
          id=$(scripts/run-bsf4oorexx.sh --source-id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - id: sources
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BSF_SOURCES }}
          key: bsf4oorexx-sources-${{ steps.source.outputs.id }}
      - name: Install svn
        if: steps.sources.outputs.cache-hit != 'true'
        # Retried, as a mirror can fail for a moment.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y subversion && exit 0
            echo "apt-get failed (attempt $attempt)"
            sleep 15
          done
          exit 1
      - id: fetch
        name: Export the BSF4ooRexx sources
        if: steps.sources.outputs.cache-hit != 'true'
        working-directory: .
        run: scripts/run-bsf4oorexx.sh --fetch
      - uses: actions/cache/save@v6
        # Saved as soon as the export succeeds, so a failing run later in the job keeps it.
        if: steps.fetch.outcome == 'success'
        with:
          path: ${{ env.BSF_SOURCES }}
          key: bsf4oorexx-sources-${{ steps.source.outputs.id }}
      - name: Release build
        run: >
          cargo build --locked --release
          -p interrexx -p interrexx-capi -p interrexx-capi-rxapi -p interrexx-rxapi
      - name: BSF4ooRexx test groups
        working-directory: .
        run: scripts/run-bsf4oorexx.sh
      - uses: actions/upload-artifact@v7
        # Also when the job is cancelled, as on its timeout.
        if: failure() || cancelled()
        with:
          name: bsf4oorexx-logs
          path: ${{ env.BSF_WORK }}/logs
          retention-days: 7
          if-no-files-found: ignore

  doctest:
    name: cargo doc tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: rust
          # A cache saved by a job that had the submodule could hold a build script's output for
          # an input that is gone here, so this job keeps its own.
          cache-key: no-submodule
      - name: Assert the upstream tier is absent
        # See the build job.
        working-directory: .
        run: |
          rmdir third_party/ooRexx
          rmdir third_party
          test ! -e third_party
          test ! -e build && test ! -L build
      - run: cargo test --locked --workspace --doc

  # The `pinning` feature's reports, which the archive above is not built with: the
  # PinReport witnesses (which Rust frames keep an activity pinned where it parks), the
  # scheduler's unit tests under the feature, and the pinning report over the corpus.
  pinning:
    name: pinning reports
    needs: [third-party]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          cache-workspaces: rust
      - uses: actions/cache/restore@v6
        with:
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ needs.third-party.outputs.key }}
          fail-on-cache-miss: true
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Install svn
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Cargo clippy with pinning
        run: cargo clippy --locked -p interrexx --all-targets --features pinning -- -D warnings
      - name: Pinning tests
        run: >
          cargo nextest run --locked -p interrexx --features pinning --profile ci
          --lib --test concurrency_tests --test corpus
          -E 'kind(lib) | (binary(concurrency_tests) & test(/^measured::/)) | (binary(corpus) & test(=pinning_report_over_the_corpus))'

  # The checked-in tables derived from the pinned ooRexx sources must match them. Needs the
  # submodule but no oracle build, so it does not wait for the third-party trees.
  upstream-interface:
    name: upstream interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: rust
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Check the generated tables
        # Regenerates every table in memory and fails, printing the differing rows, when one
        # differs from the checked-in file (a submodule bump or an edited row). The fix is
        # `cargo run -p interrexx-upstream -- write`, see docs/developing.md.
        env:
          REXX_UPSTREAM: ${{ github.workspace }}/third_party/ooRexx
        run: cargo run --locked -p interrexx-upstream -- check
      - name: Internal routine names agree with the pinned sources
        run: cargo nextest run --locked -p interrexx --test internal_routines --profile ci
      - name: The Rust layout is the pinned headers' layout
        # The ABI dump compiled as C and as C++ against the pinned `api/` headers. Named here so the
        # check stays in the job that owns the pinned tree.
        env:
          REXX_UPSTREAM: ${{ github.workspace }}/third_party/ooRexx
        run: >
          cargo nextest run --locked -p interrexx-api --test abi_dump
          -E 'test(upstream_headers)' --profile ci
      - name: include/ declares the names of the pinned headers, and no others
        # Every header of both trees, as C++ and as C: macros with their expansion from the
        # preprocessor, declarations from clang's syntax tree; the exceptions are listed in the
        # script with their reasons.
        run: python3 ../scripts/names-diff.py ../third_party/ooRexx/api ../include

  # The tests the `standalone` profile holds out: they run the built ooRexx or read the
  # submodule. `not default()` is the complement of that profile's `default-filter`, so the
  # two runs together are every test of the archive and the filter stays written once.
  # `--ignore-default-filter` is needed because nextest intersects every `-E` with the default
  # filter, which would leave this run empty.
  upstream-tier:
    name: upstream tier
    needs: [third-party, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ needs.third-party.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: rust
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Install svn
        # The extractor tests ask the oodocs working copy for its revision.
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Cargo nextest
        run: >
          cargo nextest run --archive-file "$ARCHIVE" --extract-to . --extract-overwrite --workspace-remap .
          --profile standalone --ignore-default-filter -E 'not default()'

  # The toolchain floor the workspace declares. `rust-version` in Cargo.toml is its only source.
  msrv:
    name: determine MSRV
    runs-on: ubuntu-24.04
    outputs:
      msrv: ${{ steps.msrv.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        # An empty answer would fall back to the channel of rust-toolchain.toml and pass
        # without testing the floor, so it fails the job instead.
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

  # The declared MSRV, on a checkout without the submodule. It builds every target and runs the
  # unit tests of the `standalone` profile and the doc tests, so the floor holds for the code and
  # for the tests that need no tree, and the job stays off the critical path. Lints, the header
  # compile and the integration suites run on stable in the jobs above.
  msrv-standalone:
    name: standalone (no submodule, rust ${{ needs.msrv.outputs.msrv }})
    needs: [third-party, msrv]
    runs-on: ubuntu-24.04
    env:
      # Overrides the `stable` channel of rust-toolchain.toml for every cargo call below.
      RUSTUP_TOOLCHAIN: ${{ needs.msrv.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ needs.msrv.outputs.msrv }}
          cache-workspaces: rust
          # Keyed by toolchain, and saved by this job only: a cache from a job that had the
          # submodule could hold a build script's output for an input that is gone here.
          cache-key: msrv-no-submodule-${{ needs.msrv.outputs.msrv }}
      - uses: actions/cache/restore@v6
        with:
          # Only ootest and oodocs are kept below.
          path: |
            third_party/oracle
            build
            ootest
            oodocs
          key: ${{ needs.third-party.outputs.key }}
          fail-on-cache-miss: true
      - name: Remove everything of the upstream tier
        # Only ootest and oodocs are kept from the cache: the regular tier reads them, and
        # nothing of the oracle build or the submodule may be there for a test to find.
        working-directory: .
        run: |
          rm -rf third_party/oracle build
          # The gitlink checks out as an empty directory without the submodule.
          rmdir third_party/ooRexx
          rmdir third_party
          test ! -e third_party
          test ! -e build && test ! -L build
          test -d ootest
          test -d oodocs
      - name: Provide memcap
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/memcap"
          chmod +x "$HOME/.local/bin/memcap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150
      - name: Install svn
        # The extractor tests ask the oodocs working copy for its revision.
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Cargo build
        run: cargo build --locked --workspace --all-targets
      - name: Cargo nextest
        run: cargo nextest run --locked --workspace --profile standalone --lib
      - name: Cargo doc tests
        run: cargo test --locked --workspace --doc

  # The check branch protection requires; it passes when every job above did.
  test:
    name: cargo test # the name branch protection requires; keep it
    if: always()
    needs: [shard, upstream-tier, msrv-standalone, spec-oracle, attached-stress, bsf4oorexx, doctest, pinning, upstream-interface, clippy, fmt]
    runs-on: ubuntu-24.04
    steps:
      - name: Every test job succeeded
        working-directory: .
        run: |
          echo "shards: ${{ needs.shard.result }}, upstream tier: ${{ needs.upstream-tier.result }}, msrv standalone: ${{ needs.msrv-standalone.result }}, spec oracle: ${{ needs.spec-oracle.result }}, attached stress: ${{ needs.attached-stress.result }}, bsf4oorexx: ${{ needs.bsf4oorexx.result }}, doc tests: ${{ needs.doctest.result }}, pinning: ${{ needs.pinning.result }}, upstream interface: ${{ needs.upstream-interface.result }}, clippy: ${{ needs.clippy.result }}, fmt: ${{ needs.fmt.result }}"
          test "${{ needs.shard.result }}" = success
          test "${{ needs.upstream-tier.result }}" = success
          test "${{ needs.msrv-standalone.result }}" = success
          test "${{ needs.spec-oracle.result }}" = success
          test "${{ needs.attached-stress.result }}" = success
          test "${{ needs.bsf4oorexx.result }}" = success
          test "${{ needs.doctest.result }}" = success
          test "${{ needs.pinning.result }}" = success
          test "${{ needs.upstream-interface.result }}" = success
          test "${{ needs.clippy.result }}" = success
          test "${{ needs.fmt.result }}" = success

  fmt:
    name: Cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Cargo clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          cache-workspaces: rust
          # See the build job.
          cache-key: no-submodule
      - name: Assert the upstream tier is absent
        # See the build job.
        working-directory: .
        run: |
          rmdir third_party/ooRexx
          rmdir third_party
          test ! -e third_party
          test ! -e build && test ! -L build
      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
