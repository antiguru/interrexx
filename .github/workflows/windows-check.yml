name: Windows port checks
on:
  pull_request:
    paths:
      - .github/workflows/windows-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cargo-check
  cancel-in-progress: false

defaults:
  run:
    working-directory: rust

jobs:
  api-libraries:
    name: Windows interpreter and library tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo test --locked --lib -p interrexx-rxapi -p interrexx-capi-rxapi
      - name: Test interpreter paths and search on Windows
        shell: pwsh
        run: |
          @'
          #[path = "crates/interrexx/src/paths.rs"]
          mod paths;
          #[path = "crates/interrexx/src/require.rs"]
          mod require;
          '@ | Set-Content -Encoding utf8 windows-path-tests.rs
          rustc --edition=2024 --test windows-path-tests.rs -o windows-path-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./windows-path-tests.exe

      - name: Build rexx.exe
        run: cargo build --locked -p interrexx --bin rexx
      - name: Run the Windows interpreter
        shell: pwsh
        run: |
          $rexx = (Resolve-Path target/debug/rexx.exe).Path
          function Check-Rexx($expected, $arguments) {
            $output = @(& $rexx @arguments)
            if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1 -or $output[0] -cne $expected) {
              throw "Expected '$expected', got '$($output -join '|')' (exit $LASTEXITCODE)"
            }
          }
          Check-Rexx '4' @('-e', 'say 2 + 2')
          Check-Rexx 'local queue' @('-e', "queue 'local queue'; parse pull answer; say answer")
          Check-Rexx 'child process' @('-e', "address system 'echo child process'")
          $script = Join-Path $env:RUNNER_TEMP 'échantillon.rex'
          'say 2 + 2' | Set-Content -Encoding ascii $script
          Check-Rexx '4' @($script)

      - uses: actions/upload-artifact@v7
        with:
          name: rexx-windows-x64
          path: rust/target/debug/rexx.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build and stage the x64 MSVC SDK
        shell: pwsh
        run: |
          cargo build --locked -p interrexx-capi -p interrexx-capi-rxapi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path sdk/bin, sdk/lib | Out-Null
          Copy-Item -Recurse ../include sdk/include
          foreach ($name in 'rexx', 'rexxapi') {
            Copy-Item "target/debug/$name.dll" sdk/bin
            $import = @("target/debug/$name.dll.lib", "target/debug/$name.lib") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $import) { throw "Missing $name MSVC import library" }
            Copy-Item $import "sdk/lib/$name.lib"
          }

      - name: Link and run C clients against the SDK
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          cl /nologo /W4 /WX /TP /c /I sdk\include /I sdk\include\platform\windows ..\ci\windows-sdk-smoke.cpp /Fo:sdk-smoke.obj || exit /b 1
          cl /nologo /W4 /WX /TC /c /I sdk\include /I sdk\include\platform\windows ..\ci\windows-rxapi-smoke.c /Fo:rxapi-smoke.obj || exit /b 1
          link /nologo /OUT:sdk\bin\sdk-smoke.exe sdk-smoke.obj sdk\lib\rexx.lib || exit /b 1
          link /nologo /OUT:sdk\bin\rxapi-smoke.exe rxapi-smoke.obj sdk\lib\rexxapi.lib || exit /b 1
          sdk\bin\sdk-smoke.exe || exit /b 1
          sdk\bin\rxapi-smoke.exe || exit /b 1
          del sdk\bin\sdk-smoke.exe sdk\bin\rxapi-smoke.exe

      - uses: actions/upload-artifact@v7
        with:
          name: interrexx-sdk-windows-x64
          path: rust/sdk/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/checkout@v7
        with:
          repository: ooRexx/ooRexx
          ref: b12f5f5b41c81a71a872a0fd5a6638ff87c08e97
          path: upstream-oodialog
          persist-credentials: false
      - name: Build the pinned ooDialog packages and launchers
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          cmake -S ..\ci\windows-oodialog -B oodialog-build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DINTERREXX_SDK=%CD%\sdk" "-DOOREXX_SOURCE=%CD%\..\upstream-oodialog" || exit /b 1
          cmake --build oodialog-build --parallel 2 || exit /b 1
          for %%p in (oodialog ooshapes) do (
            dumpbin /exports sdk\bin\%%p.dll | findstr /r /c:" RexxGetPackage$" || exit /b 1
          )
          for %%p in (ooDialog.exe ooDialog.com) do (
            dumpbin /imports sdk\bin\%%p | findstr /i /c:"rexx.dll" || exit /b 1
          )

      - name: Generate the class libraries and exercise an ooDialog callback
        shell: pwsh
        timeout-minutes: 2
        run: |
          $bin = (Resolve-Path sdk/bin).Path
          $source = (Resolve-Path ../upstream-oodialog/extensions/platform/windows/oodialog).Path
          Copy-Item target/debug/rexx.exe $bin
          Copy-Item "$source/ooShapes.cls" $bin
          Copy-Item ../ci/windows-oodialog/smoke.rex $bin
          Push-Location $source
          try {
            & "$bin/rexx.exe" build_ooDialog_cls.rex $bin
            if ($LASTEXITCODE -ne 0) { throw "ooDialog class generation failed ($LASTEXITCODE)" }
          } finally { Pop-Location }
          foreach ($class in 'ooDialog.cls', 'oodPlain.cls', 'oodWin32.cls') {
            if (!(Test-Path "$bin/$class")) { throw "Missing $class" }
          }
          Push-Location $bin
          try {
            $output = @(& ./rexx.exe smoke.rex)
            if ($LASTEXITCODE -ne 0 -or $output -cnotcontains 'ooDialog button event passed') {
              throw "ooDialog callback failed ($LASTEXITCODE): $($output -join '|')"
            }
            $version = @(& ./ooDialog.com --version)
            if ($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch 'ooDialog') {
              throw "ooDialog launcher failed ($LASTEXITCODE): $($version -join '|')"
            }
          } finally { Pop-Location }
