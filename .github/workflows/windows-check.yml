name: Windows port checks
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-check.yml
      - .gitmodules
      - ci/windows-*
      - ci/windows-*/**
      - include/**
      - rust/.cargo/**
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/crates/**
      - rust/rust-toolchain.toml
      - third_party/ooRexx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-sysgetkey-oracle-probe
  cancel-in-progress: false

defaults:
  run:
    working-directory: rust

jobs:
  api-libraries:
    name: Windows interpreter and library tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check out the pinned ooRexx revision
        working-directory: .
        run: git submodule update --init --depth 1 -- third_party/ooRexx
      - name: Build the reference and the console fixture
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          cmake -G Ninja -S ..\third_party\ooRexx -B "%RUNNER_TEMP%\oorexx-build" -DCMAKE_BUILD_TYPE=Release -DORX_ENABLE_IPO=OFF || exit /b 1
          cmake --build "%RUNNER_TEMP%\oorexx-build" --target rexx_exe rexx_img --parallel 4 || exit /b 1
          cl /nologo /W4 /WX /TC ..\ci\windows-rexxutil-console.c /Fe:oracle-console.exe /link user32.lib || exit /b 1
      - name: Measure Windows ooRexx keyboard results
        shell: pwsh
        run: |
          $oracle = Join-Path $env:RUNNER_TEMP 'oorexx-build/bin/rexx.exe'
          if (-not (Test-Path $oracle)) { throw 'No built ooRexx executable' }
          $env:PATH = "$(Split-Path -Parent $oracle);$env:PATH"
          $source = (Resolve-Path ../ci/windows-sysgetkey-oracle.rex).Path
          foreach ($page in '1252', '437') {
            $report = Join-Path $env:RUNNER_TEMP "key-$page.txt"
            & ./oracle-console.exe $oracle $source $report $page
            $result = $LASTEXITCODE
            if (Test-Path $report) { Write-Host "CP${page}: $((Get-Content $report) -join ' ')" }
            if ($result -ne 0) { throw "Console fixture returned $result" }
          }
