# Unmodified third-party trees. `setup-third-party.sh` populates them.
[env]
REXX_UPSTREAM = { value = "../third_party/ooRexx", relative = true }
REXX_ORACLE_ROOT = { value = "../third_party/oracle", relative = true }
# Every process cargo runs, tests and the programs they start, reaches an API service of its own
# instead of the user's: this crate's through `REXX_API_DIR`, the oracle's, whose daemon follows
# `XDG_RUNTIME_DIR`, through that. `tests/rxapi.rs` checks both.
REXX_API_DIR = { value = "target/rexx-api", relative = true, force = true }
XDG_RUNTIME_DIR = { value = "target/oracle-runtime", relative = true, force = true }
