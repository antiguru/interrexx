[package]
name = "interrexx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Object model, heap and garbage collector for interrexx"

[dependencies]
# `Body::Text` holds a cached `Number` parse and `Body::Num` holds the
# `Number`/`Form` a value's identity is fixed to at creation (D15), so the
# object model depends on the arithmetic core.
interrexx-num.workspace = true

# The hasher behind `NameMap`, the two hot name-keyed tables. See that alias
# for what it replaces and why the default one costs what it does.
rustc-hash = "2.1.2"

# SipHash-1-3, the keyed hash behind `HashSeed`: a string's hash code,
# seeded per interpreter against chosen collisions.
siphasher = { version = "1.0.4", default-features = false }

# The keyed hash of a stem's tail map, keyed from the interpreter's
# `HashSeed`. A tail's hash is never observable, so a faster keyed hash than
# SipHash keeps the map's resistance to chosen collisions. No default
# features, so it draws no keys of its own.
ahash = { version = "0.8.12", default-features = false }

# The table behind std's `HashMap`, used directly for a stem's tail map: its
# `entry_ref` finds or files a borrowed key with one hash, where std needs a
# lookup and then an insert. No default features, so it brings no hasher.
hashbrown = { version = "0.16.1", default-features = false }

[features]
# The sharing-fraction instrument's tags, `Heap::sharing_counts`.
sharing = []
# Variable slots laid out for compiled code to read and write in place
# (`VarSlot`), which `interrexx`'s own `jit` feature turns on.
jit = []

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "heap"
harness = false

[lints]
workspace = true
