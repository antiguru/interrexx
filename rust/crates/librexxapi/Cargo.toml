[package]
name = "librexxapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rexxapi"
# `rlib` beside the `cdylib` so `cargo test` builds the shared object its tests read.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The interpreter's API client, whose connection, session queue and in-process
# registrations the exports share with any interpreter in the same image.
rexx-exec = { path = "../rexx-exec" }
# The `#[repr(C)]` structs of `api/rexx.h`.
rexx-api = { path = "../rexx-api" }

[lints]
workspace = true
