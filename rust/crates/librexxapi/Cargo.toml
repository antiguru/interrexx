[package]
name = "librexxapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rexxapi"
# `rlib` beside the `cdylib` so `cargo test` builds the shared object its tests read.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The `#[repr(C)]` structs of `api/rexx.h` the forwarded signatures name.
rexx-api = { path = "../rexx-api" }
# `dlopen` and `dlsym`, which find each forwarded name in `librexx.so.4`.
libc = "0.2.186"

[lints]
workspace = true
