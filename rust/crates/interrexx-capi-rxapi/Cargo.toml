[package]
name = "interrexx-capi-rxapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The shared library librexxapi.so forwarding the classic API names to librexx.so"

[lib]
name = "rexxapi"
# `rlib` beside the `cdylib` so `cargo test` builds the shared object its tests read.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The `#[repr(C)]` structs of `api/rexx.h` the forwarded signatures name.
interrexx-api.workspace = true

[target.'cfg(unix)'.dependencies]
# `dlopen` and `dlsym` find each forwarded name in the interpreter library.
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
# Find and load the interpreter DLL installed beside the forwarding DLL.
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader"] }
# The numeric conversions, each named for what it keeps.
interrexx-cast.workspace = true

[lints]
workspace = true
