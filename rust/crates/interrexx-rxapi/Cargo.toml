[package]
name = "interrexx-rxapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The API service of interrexx: external queues, registrations and the macrospace"

[features]
# Exposes `transport::direct`; never in a default build.
test-direct = []

[dependencies]
# `classic_procedure`: `rxsubcom LOAD` loads a registration's library and finds its handler.
interrexx-api.workspace = true
interrexx-inventory.workspace = true

[target.'cfg(unix)'.dependencies]
# The Unix daemon stamps replies with the local time and uses Unix signals and descriptors.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
libc = "0.2.186"
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }

# `getpeereid`, the peer's user where the kernel has no `SO_PEERCRED`.
[target.'cfg(all(unix, not(any(target_os = "linux", target_os = "android"))))'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket", "user"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
interprocess = "=2.4.5"
widestring = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
