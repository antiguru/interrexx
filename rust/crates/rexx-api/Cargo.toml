[package]
name = "rexx-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# A hasher with no per-process seed.
rustc-hash = "2.1.2"

# `ObjRef` and its generation field, which is what `handles.rs` turns into an
# opaque `RexxObjectPtr` and back (D5).
rexx-core = { path = "../rexx-core" }

# `dlopen`/`dlsym` provider for `load.rs`; `rustix` does not wrap either (D-U1,
# 2026-09-14).
libloading = "0.9.0"

# `free`, which releases a result block a classic handler allocated in place of the buffer it
# was handed (`load.rs`).
libc = "0.2.186"

[lints]
workspace = true
