# cargo-nextest configuration; the workspace root is this directory's parent.
# Doc tests are not run by nextest: `cargo test --workspace --doc` runs them.

nextest-version = "0.9.150"
experimental = ["setup-scripts"]

[profile.default]
slow-timeout = { period = "60s" }

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s" }

[profile.ci.junit]
# JUnit output stays off; a path here would turn it on.

# Tests whose assertion is a wall-clock boundary (a signal inside a sleep, a halt before a
# program ends, a prompt before a read, a watchdog's deadline, a replayed clock). Each waits on
# time, so they run one at a time and claim four test threads each, which keeps a saturated
# machine from stretching the window they measure.
[test-groups.wall-clock]
max-threads = 1

[[profile.default.overrides]]
filter = '''
(binary(signals) | binary(stdin_contention) | binary(program_end) | binary(prompt_before_read)
| binary(oracle_deadline) | binary(deadline) | binary(sim_processes) | binary(rxsock_waits)
| binary(idle_wakes))
  & !test(/^support::/)
| test(a_run_ending_with_a_call_in_flight_serves_the_call_then_drops_the_interpreter)
| (binary(classic_api) & test(/sigint|halt|group_signal|the_classic_family_answers/))
'''
test-group = 'wall-clock'
threads-required = 4

# These tests missed their time window on a loaded host while the suite ran. Each is run again
# once; the run reports a pass on the second attempt as flaky and a second miss fails it.
# Tests that rerun a mismatch themselves (signals, stdin_contention) and the Ctrl-C witnesses
# run once.
[[profile.ci.overrides]]
filter = '''
test(=a_valued_reply_ends_the_same_program)
| test(=a_group_signal_halts_both_interpreters_waiting_on_commands)
| test(=a_halt_from_another_thread_reaches_a_native_calls_activity)
| test(=a_sigint_during_rexx_start_halts_the_program_not_the_process)
| test(=the_classic_family_answers_as_the_oracle_does)
| test(=two_instances_keep_their_environments_and_both_take_a_halt)
'''
retries = 1

# The standalone suite: everything that runs without `third_party/` (no submodule, no
# `third_party/oracle`, no `build` link). `default-filter` keeps the upstream tier out of it. The
# tier of each entry (oracle: needs the built ooRexx or its `build/lib` extension libraries;
# source: needs files of the submodule) and the path it needs are listed here, in the order of
# the filter, because a filterset takes no comments. The set comes from the measured run of the
# archive with and without each tree (D0 of #388), not from reading test bodies. An entry added
# only to turn the standalone run green needs a tier and a reason in this list; the build job
# checks that every name below still exists (`scripts/check_standalone_filter.py`).
#
# A test that needs `third_party/` fails loudly when it is absent. The filter keeps it out of this
# profile; no test skips itself for lack of a tree. Tests gated by an environment variable
# (REXX_CORPUS_GATE and the like) pass vacuously without it and stay in the profile.
#
# interrexx-api::invoke: oracle (15 tests), source (1 test): binary: oracle-built extension libraries (build/lib) and the api/ header of the submodule
# interrexx-inventory::oracle_agreement: source: binary: interpreter/messages sources of the submodule
# interrexx-parse::samples: source: binary: samples/ programs of the submodule
# interrexx-parse::variants: source: binary: samples/ programs of the submodule
# interrexx::classic_api: oracle+source: binary: testbinaries/, extensions/ and samples/ sources and api/ headers of the submodule, built into test extensions; a few also run the oracle
# interrexx::release_local_reference: source: binary: compiles test extensions against the submodule api/ headers
# interrexx::rexx_command: oracle: binary: runs the oracle binary and copies its librxmath.so
# interrexx::termination_context: source: binary: compiles a test extension against the submodule api/ headers
# every binary: oracle: runs the oracle (the arity identity test compiled into about 40 binaries)
# interrexx-capi::exports, interrexx-capi-rxapi::exports: oracle: compare the exported names with the oracle's librexx.so.4 and librexxapi.so.4 (fail loudly without them)
# interrexx: source: reads the builtin function sources of the submodule (interpreter/expression) (1 test)
# interrexx: oracle: loads oracle-built extension libraries through build/lib (37 tests)
# interrexx-api::context: oracle: loads oracle-built extension libraries through build/lib (10 tests)
# interrexx-api::abi_dump: source: compiles a dump program against the api/ headers of the submodule (2 tests)
# interrexx-api::layout: source: reads the api/ header of the submodule (6 tests)
# interrexx-api::load: oracle: loads oracle-built extension libraries through build/lib (5 tests)
# interrexx-api::load: source: reads the api/ header of the submodule (2 tests)
# interrexx-api::values: source: reads the api/ header of the submodule (4 tests)
# interrexx-extract::extract_docs: source: reads the directive parser sources of the submodule (interpreter/parser) (1 test)
# interrexx-parse::errors: source: reads interpreter/parser sources and samples/ of the submodule (2 tests)
# interrexx::boolean_handles: source: compiles a test extension against the submodule api/ headers (1 test)
# interrexx::builtin_status: oracle: runs or reads the oracle build (third_party/oracle) (2 tests)
# interrexx::collection_arity: oracle: runs or reads the oracle build (third_party/oracle) (16 tests)
# interrexx::collection_scopes: oracle+source: needs the oracle binary and files of the submodule (1 test)
# interrexx::compiled: oracle: runs or reads the oracle build (third_party/oracle) (5 tests)
# interrexx::corpus: oracle: runs or reads the oracle build (third_party/oracle) (25 tests)
# interrexx::datetime_zone: oracle+source: needs the oracle binary and files of the submodule (1 test)
# interrexx::datetime_zone: oracle: runs or reads the oracle build (third_party/oracle) (2 tests)
# interrexx::directive_options: oracle: runs or reads the oracle build (third_party/oracle) (2 tests)
# interrexx::gate_table_c: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
# interrexx::gate_table_d: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
# interrexx::internal_routines: source: reads the internal routine sources of the submodule (interpreter/runtime) (1 test)
# interrexx::introspection_arity: oracle: runs or reads the oracle build (third_party/oracle) (17 tests)
# interrexx::introspection_scopes: oracle+source: needs the oracle binary and files of the submodule (1 test)
# interrexx::library_routine_memory: oracle: runs or reads the oracle build (third_party/oracle) (3 tests)
# interrexx::licensed_divergences: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
# interrexx::method_bodies: oracle: runs or reads the oracle build (third_party/oracle) (16 tests)
# interrexx::numeric_model: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
# interrexx::package_requires: oracle: runs or reads the oracle build (third_party/oracle) (4 tests)
# interrexx::rexxc: oracle: runs or reads the oracle build (third_party/oracle) (2 tests)
# interrexx::rxapi: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
# interrexx::sim_processes: oracle: loads oracle-built extension libraries through build/lib (1 test)
# interrexx::spec: oracle: runs or reads the oracle build (third_party/oracle) (2 tests)
# interrexx::state_builtin_oracle: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
# interrexx::stream_model: oracle: runs or reads the oracle build (third_party/oracle) (2 tests)
# interrexx::suite: oracle+source: needs the oracle binary and files of the submodule (17 tests)
# interrexx::timing_witnesses: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
# interrexx::unreachable_classes: oracle: runs or reads the oracle build (third_party/oracle) (1 test)
[profile.standalone]
fail-fast = false
default-filter = '''
not (
  binary_id(=interrexx-api::invoke)
  | binary_id(=interrexx-inventory::oracle_agreement)
  | binary_id(=interrexx-parse::samples)
